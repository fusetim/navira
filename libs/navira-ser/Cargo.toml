[package]
name = "navira-ser"
version = "0.1.0"
description = "Serialization utilities for Navira"
keywords = ["navira", "libp2p", "ipld"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
authors.workspace = true
repository.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]

hex = { version = "0.4" }
thiserror = { workspace = true, optional = true }
navira-peer = { path = "../navira-peer", optional = true }
cid = { workspace = true }

base64 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[features]
varint = []
signed-envelope = ["varint", "dep:navira-peer", "dep:thiserror"]
ipld = ["varint", "dep:base64", "dep:serde", "dep:serde_json"]
default = ["signed-envelope"]