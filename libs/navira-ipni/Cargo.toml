[package]
name = "navira-ipni"
version = "0.1.0"
description = "Parsing and serializing IPNI HTTP provider data"
keywords = ["ipni", "ipld", "content-addressable", "ipfs", "navira"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
authors.workspace = true
repository.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
cid = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
navira-ser = { path = "../navira-ser", features = ["ipld"] }
navira-peer = { path = "../navira-peer", optional = true }
sha2 = { workspace = true, optional = true }
multiaddr = { workspace = true }

[features]
default = ["sign"]
sign = ["dep:navira-peer", "dep:sha2", "navira-ser/signed-envelope"]
