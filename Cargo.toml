[workspace]
resolver = "3"
members = [
    "apps/navira-store", 
    "libs/navira-car", "libs/navira-ipni", "libs/navira-peer", "libs/navira-ser",
]

[workspace.package]
authors = ["FuseTim"]
edition = "2024"
license = "EUPL-1.2 OR CECILL-2.1"
repository = "https://github.com/fusetim/navira"

[workspace.dependencies]
base64 = { version = "0.23" }
cid = "0.11"
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.27", default-features = false }
log = "*"
multiaddr = { version = "0.19.1", default-features = false }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3"
tokio = { version = "1.53.3", default-features = false }
tokio-stream = { version = "0.1.19", default-features = false }
toml = { version = "0.7.5", default-features = false }
thiserror = "2.0.21"
ciborium = "0.2.2"
serde = { version = "1.0.229" }
serde_json = { version = "1.0.154" }
sha2 = { version = "0.11.1" }
reqwest = { version = "0.13.5" }
