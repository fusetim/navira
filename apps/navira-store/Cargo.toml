[package]
name = "navira-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8", features = ["http2"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-zstd", "trace", "cors"] }
cid = { workspace = true }
clap = { workspace = true }
config = { workspace = true, features = ["toml"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [ "full" ] }
tokio-stream = { workspace = true }
toml = { workspace = true, features = ["default"] }
thiserror = { workspace = true }
mimalloc = { workspace = true, optional = true }
multiaddr = { workspace = true }
navira-car = { path = "../../libs/navira-car", features = ["tokio-io", "cid"] }
navira-ipni = { path = "../../libs/navira-ipni" }
navira-peer = { path = "../../libs/navira-peer" }
navira-ser = { path = "../../libs/navira-ser", features = ["ipld"] }

[features]
default = []
mimalloc = ["dep:mimalloc"]